 <!-- ============ PAGE CONTENT ============ -->
 <main class="container-fluid p-4">
   <div class="d-flex justify-content-between align-items-center mb-3">
     <h3 class="fw-bold mb-0">Ingredients (Inventory)</h3>
     <button class="btn btn-danger" onclick="openAdd()"><i class="bi bi-plus-lg"></i> Add ingredient</button>
   </div>

   <!-- Add / Edit form -->
   <div id="formCard" class="card shadow-sm mb-3 d-none"><div class="card-body">
     <h6 class="fw-bold mb-3" id="formTitle">Add ingredient</h6>
     <form onsubmit="save(event)">
       <div class="row g-3">
         <div class="col-md-4"><label class="form-label">Name</label><input id="fName" class="form-control" required></div>
         <div class="col-md-2"><label class="form-label">Unit</label><input id="fUnit" class="form-control" placeholder="kg, pcs…" required></div>
         <div class="col-md-3"><label class="form-label">Quantity in stock</label><input id="fQty" type="number" step="0.01" class="form-control" required></div>
         <div class="col-md-3"><label class="form-label">Reorder level</label><input id="fReorder" type="number" step="0.01" class="form-control" required></div>
       </div>
       <div class="mt-3">
         <button class="btn btn-danger">Save</button>
         <button type="button" class="btn btn-light" onclick="closeForm()">Cancel</button>
       </div>
     </form>
   </div></div>

   <!-- Table -->
   <div class="card shadow-sm"><div class="table-responsive">
     <table class="table table-hover align-middle mb-0">
       <thead><tr><th>ID</th><th>Name</th><th>In stock</th><th>Unit</th><th>Reorder at</th><th>Status</th><th>Actions</th></tr></thead>
       <tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody>
     </table>
   </div></div>
 </main>
  <!-- ===== a little JavaScript for this page ===== -->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script src="js/app.js"></script>
 <script>
   requireAdmin();

   let list = [];
   let editId = null;

   // Work out the stock status from the numbers.
   function stockStatus(qty, reorder) {
     if (qty <= 0) return badge("Out of stock");
     if (qty <= reorder) return badge("Low stock");
     return badge("In stock");
   }

   async function load() {
     list = await api("GET", EP.ingredients);
     document.getElementById("rows").innerHTML = list.map(i => `
       <tr>
         <td>${i.ingredientId}</td>
         <td>${esc(i.ingredientName)}</td>
         <td>${i.quantityInStock}</td>
         <td>${esc(i.unitOfMeasure)}</td>
         <td>${i.reorderLevel}</td>
         <td>${stockStatus(i.quantityInStock, i.reorderLevel)}</td>
         <td>
           <button class="btn btn-sm btn-outline-primary" onclick="openEdit(${i.ingredientId})">Edit</button>
           <button class="btn btn-sm btn-outline-danger" onclick="del(${i.ingredientId})">Delete</button>
         </td>
       </tr>`).join("");
   }

   function openAdd() {
     editId = null;
     document.getElementById("formTitle").textContent = "Add ingredient";
     document.getElementById("fName").value = "";
     document.getElementById("fUnit").value = "";
     document.getElementById("fQty").value = "";
     document.getElementById("fReorder").value = "";
     document.getElementById("formCard").classList.remove("d-none");
   }

   function openEdit(id) {
     const i = list.find(x => x.ingredientId === id);
     editId = id;
     document.getElementById("formTitle").textContent = "Edit ingredient";
     document.getElementById("fName").value = i.ingredientName;
     document.getElementById("fUnit").value = i.unitOfMeasure;
     document.getElementById("fQty").value = i.quantityInStock;
     document.getElementById("fReorder").value = i.reorderLevel;
     document.getElementById("formCard").classList.remove("d-none");
   }

   function closeForm() { document.getElementById("formCard").classList.add("d-none"); }

   async function save(event) {
     event.preventDefault();
     const data = {
       ingredientName: document.getElementById("fName").value,
       unitOfMeasure: document.getElementById("fUnit").value,
       quantityInStock: Number(document.getElementById("fQty").value),
       reorderLevel: Number(document.getElementById("fReorder").value)
     };
     try {
       if (editId) { data.ingredientId = editId; await api("PUT", EP.ingredientUpdate(editId), data); }
       else        { await api("POST", EP.ingredients, data); }
       closeForm();
       load();
     } catch (err) { alert(err.message); }
   }

   async function del(id) {
     if (!confirm("Delete ingredient #" + id + "?")) return;
     try { await api("DELETE", EP.ingredientDelete(id)); load(); }
     catch (err) { alert(err.message); }
   }

   load();
 </script>
</body>
</html>
