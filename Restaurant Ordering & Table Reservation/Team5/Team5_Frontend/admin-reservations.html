    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="admin-dashboard.html"><img src="img/logo.svg" alt="Spoons Logo" height="30"> spoons admin</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-users.html">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-categories.html">Categories</a></li>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="container-fluid p-4">
    <h3 class="fw-bold mb-3">Reservations</h3>

    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Customer</th><th>Table</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="8">Loading…</td></tr></tbody>
      </table>
    </div></div>
  </main>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAdmin(); <!-- Is he admin?-->

    // Load reservations, plus users + tables from backend so we can show names.
    async function load() {
      const rows = document.getElementById("rows");
      try {
        const users  = await api("GET", EP.users); <!-- Get users from backend, the EP is in app.js-->  
        const tables = await api("GET", EP.tables);
        const list   = await api("GET", EP.reservations);
        const userName  = id => (users.find(u => u.userId === id) || {}).userName || ("#" + id); <!-- Get user name from user id -->
        const tableName = id => (tables.find(t => t.tableId === id) || {}).tableNumber || ("#" + id); <!-- Get table number from table id -->

        const statuses = ["Pending", "Confirmed", "Completed", "Cancelled"]; <!-- Possible reservation statuses -->

        rows.innerHTML = list.map(r => `
          <tr>
            <td>${r.reservationId}</td>
            <td>${esc(userName(r.userId))}</td> <!-- Show user name -->
            <td>${esc(tableName(r.tableId))}</td> <!-- Show table number -->
            <td>${esc(r.reservationDate)}</td> <!-- Show reservation date -->
            <td>${esc(String(r.reservationTime).slice(0,5))}</td> <!-- Show reservation time, slice to show only HH:MM -->
            <td>${r.partySize}</td> <!-- Show party size -->
            <td>
              <select class="form-select form-select-sm" onchange="setStatus(${r.reservationId}, this.value)"> <!-- Dropdown to change reservation status -->
                ${statuses.map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}
              </select>
            </td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="del(${r.reservationId})">Delete</button></td>
          </tr>`).join("");
      } catch (err) {
        rows.innerHTML = `<tr><td colspan="8" class="text-danger">${esc(err.message)}</td></tr>`;
      }
    }

    // Change a reservation's status.
    async function setStatus(id, status) {
      try { await api("PUT", EP.reservationStatus(id, status)); }
      catch (err) { alert(err.message); }
    }

    // Delete a reservation.
    async function del(id) {
      if (!confirm("Delete reservation #" + id + "?")) return;
      try { await api("DELETE", EP.reservationDelete(id)); load(); }
      catch (err) { alert(err.message); }
    }

    load();
  </script>
</body>
</html>
