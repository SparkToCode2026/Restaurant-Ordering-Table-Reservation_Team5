  <!-- Page Content -->
   <div class="container-fluid mt-4">
    <h3 class="fw-bold mb-3">Payments</h3>

    <div class="card shadow-sm"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead><tr><th>ID</th><th>Order</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th><th>Reference</th></tr></thead>
            <tbody id="rows"><tr><td colspan="8">Loading…</td></tr></tbody>
        </table>
    </div></div>

    <!-- a little JavaScript for this page -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        requireAdmin();

        const methodName = n => ({ 1: "Cash", 2: "Card", 3: "Online" }[n] || ("#" + n));

        async function load() {
        const rows = document.getElementById("rows");
        try {
            const list = await api("GET", EP.payments);
            rows.innerHTML = list.length ? list.map(p => `
              <tr>
                <td>${p.paymentId}</td>
                <td>#${p.orderId}</td>
                <td>${money(p.amount)}</td>
                <td>${methodName(p.paymentMethod)}</td>
                <td>${badge(p.paymentStatus)}</td>
                <td>${new Date(p.paymentDate).toLocaleString()}</td>
                <td>${esc(p.transactionRef)}</td>
                <td><button class="btn btn-sm btn-outline-danger" onclick="del(${p.paymentId})">Delete</button></td>
              </tr>`).join("") : '<tr><td colspan="8" class="text-secondary">No payments yet.</td></tr>';
        } catch (err) {
          rows.innerHTML = `<tr><td colspan="8" class="text-danger">${esc(err.message)}</td></tr>`;
        }
      }

      async function del(id) {
        if (!confirm("Delete payment #" + id + "?")) return;
        try { await api("DELETE", EP.paymentDelete(id)); load(); }
        catch (err) { alert(err.message); }
      }

      load();
    </script>
</body>
</html>
