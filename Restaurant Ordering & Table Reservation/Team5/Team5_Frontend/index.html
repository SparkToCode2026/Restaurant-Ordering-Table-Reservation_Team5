<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoons · Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html"><img src="img/logo.svg" alt="Spoons Logo" height="30"> spoons</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="reserve.html">Reserve</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="reservations.html">My Reservations</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="cart.html" class="btn btn-outline-danger"><i class="bi bi-cart3"></i> Cart <span id="cartCount" class="badge text-bg-danger">0</span></a>
          <a href="profile.html" class="btn btn-outline-secondary"><i class="bi bi-person"></i></a>
          <button class="btn btn-outline-secondary" onclick="logout()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="container py-4">

    <!-- Hero banner (plain HTML) -->
    <div class="hero text-white rounded-4 p-5 mb-4">
      <span class="badge bg-light text-dark mb-2">Fresh · Local · Made to order</span>
      <h1 class="display-5 fw-bold">Great food, reserved just for you.</h1>
      <p class="lead">Browse the menu, book a table, and order dine-in or takeaway.</p>
      <a href="reserve.html" class="btn btn-danger btn-lg me-2">Reserve a table</a>
      <a href="menu.html" class="btn btn-light btn-lg">Browse menu</a>
    </div>

    <h4 class="fw-bold mb-3">Featured dishes</h4>
    <!-- The dishes are added here by the script below -->
    <div id="featured" class="row g-3">Loading…</div>

  </main>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireLogin();  // must be signed in to see the site

    // Get the menu from the server and show the first 4 available dishes.
    async function loadFeatured() {
      const box = document.getElementById("featured");
      try {
        const dishes = await api("GET", EP.items);
        const featured = dishes.filter(d => d.isAvailable).slice(0, 4);
        box.innerHTML = featured.map(d => `
          <div class="col-6 col-lg-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h6 class="fw-bold">${esc(d.menuItemName)}</h6>
                <p class="small text-secondary">${esc(d.menuItemDescription)}</p>
                <div class="fw-bold text-danger">${money(d.price)}</div>
                <button class="btn btn-sm btn-danger mt-2"
                        onclick="Cart.add(${d.menuItemId}, '${esc(d.menuItemName)}', ${d.price}); location.reload()">
                  Add to cart
                </button>
              </div>
            </div>
          </div>`).join("");
      } catch (err) {
        box.innerHTML = `<p class="text-danger">Could not load the menu: ${esc(err.message)}</p>`;
      }
    }
    loadFeatured();
  </script>
</body>
</html>
