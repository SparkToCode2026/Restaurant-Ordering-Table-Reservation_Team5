<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spoons | Team5</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="toastArea" class="toast-container position-fixed top-0 end-0 p-3"></div>

<div id="authView" class="min-vh-100 auth-bg d-flex align-items-center justify-content-center p-3">
  <div class="card auth-card shadow-lg border-0"><div class="card-body p-4 p-md-5">
    <div class="text-center mb-4"><div class="brand-mark mx-auto mb-2"><i class="bi bi-cup-hot-fill"></i></div>
      <h2 class="fw-bold">SPOONS</h2><p class="text-secondary">Restaurant Ordering & Table Reservation</p></div>
    <div class="nav nav-pills nav-fill mb-4">
      <button class="nav-link active" data-auth-tab="login">Login</button>
      <button class="nav-link" data-auth-tab="register">Register</button>
    </div>
    <form id="loginForm">
      <div class="mb-3"><label class="form-label">Email</label><input id="loginEmail" type="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input id="loginPassword" type="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <form id="registerForm" class="d-none">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">User name</label><input id="regName" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Phone</label><input id="regPhone" class="form-control" required></div>
        <div class="col-12"><label class="form-label">Email</label><input id="regEmail" type="email" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Password</label><input id="regPassword" type="password" minlength="6" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Role</label><select id="regRole" class="form-select"><option>Customer</option><option>Staff</option><option>Admin</option></select></div>
      </div>
      <button class="btn btn-primary w-100 mt-4">Create account</button>
    </form>
  </div></div>
</div>

<div id="appView" class="d-none">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top"><div class="container-fluid">
  <a class="navbar-brand fw-bold" href="#"><i class="bi bi-cup-hot-fill me-2"></i>SPOONS</a>
  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="nav"><ul id="navLinks" class="navbar-nav me-auto"></ul>
    <span id="currentUser" class="text-white-50 me-3 small"></span><button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
  </div>
</div></nav>

<main class="container-fluid py-4">
<section id="dashboardSection">
  <div class="hero rounded-4 p-4 p-md-5 mb-4 text-white"><span class="badge bg-light text-dark mb-2">TEAM 5 • SPOONS</span>
    <h1 class="display-6 fw-bold">Restaurant Management Dashboard</h1>
    <p class="lead">Menu, tables, reservations, orders, payments, inventory and reviews.</p>
  </div>
  <div id="stats" class="row g-3"></div>
  <div class="card border-0 shadow-sm mt-4"><div class="card-body"><h5>Quick actions</h5><div id="quickActions" class="d-flex flex-wrap gap-2"></div></div></div>
</section>

<section id="resourceSection" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div><button id="backDashboard" class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-arrow-left"></i></button><span id="resourceTitle" class="h3 fw-bold"></span></div>
    <button id="addBtn" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add</button>
  </div>
  <div class="card border-0 shadow-sm mb-3"><div class="card-body"><div class="row g-2 align-items-end">
    <div class="col-lg-4"><label class="form-label">Filter value</label><input id="searchInput" class="form-control"></div>
    <div class="col-lg-3"><label class="form-label">Field</label><select id="filterField" class="form-select"></select></div>
    <div class="col-lg-2"><button id="filterBtn" class="btn btn-outline-primary w-100">Filter</button></div>
    <div class="col-lg-2"><button id="sortBtn" class="btn btn-outline-secondary w-100">Sort</button></div>
    <div class="col-lg-1"><button id="countBtn" class="btn btn-outline-dark w-100">#</button></div>
  </div><div id="aggregateBox" class="mt-3"></div></div></div>
  <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
  <div id="emptyState" class="text-center p-5 d-none"><i class="bi bi-inbox fs-1"></i><p>No records found.</p></div></div>
</section>
</main>
</div>

<div class="modal fade" id="recordModal"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 id="modalTitle" class="modal-title"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <form id="recordForm"><div id="formFields" class="modal-body"></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div></form>
</div></div></div>
<div class="modal fade" id="detailModal"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><pre id="detailJson" class="json-box"></pre></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/app.js"></script>
</body></html>
