<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoons admin . Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Admin Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="admin-dashboard.html"><img src="/img/logo.svg" alt="Spoons Logo" height="30"> spoons admin</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="admin-dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Users</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Menu Items</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Tables</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Reservations</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Payments</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Reviews</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Ingredients</a></li>
            </ul>
            <button class="btn btn-outline-light ms-3" onclick="logout()">Sign Out</button>
        </div>
    </div>
</nav>

<!-- Page Content -->
<main class="container-fluid p-4">
    <h3 class="fw-bold mb-3">Dashboard</h3>

    <!-- Count Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md"><div class="card shadow-sm text-center"><div class="card-body">
            <div class="fs-3 fw-bold text-danger" id="cUsers">-</div><div class="small text-secondary">Users</div></div></div></div>
        <div class="col-6 col-md"><div class="card shadow-sm text-center"><div class="card-body">
            <div class="fs-3 fw-bold text-danger" id="cItems">-</div><div class="small text-secondary">Menu items</div></div></div></div>
        <div class="col-6 col-md"><div class="card shadow-sm text-center"><div class="card-body">
            <div class="fs-3 fw-bold text-danger" id="cReservations">-</div><div class="small text-secondary">Reservations</div></div></div></div>
        <div class="col-6 col-md"><div class="card shadow-sm text-center"><div class="card-body">
            <div class="fs-3 fw-bold text-danger" id="cOrders">-</div><div class="small text-secondary">Orders</div></div></div></div>
        <div class="col-6 col-md"><div class="card shadow-sm text-center"><div class="card-body">
            <div class="fs-3 fw-bold text-danger" id="cRevenue">-</div><div class="small text-secondary">Revenue</div></div></div></div>
    </div>

    <!-- Recent orders -->
    <div class="card shadow-sm">
      <div class="card-body"><h6 class="fw-bold mb-3">Recent orders</h6>
        <div class="table-responsive">
          <table class="table mb-0">
            <thead><tr><th>Order</th><th>Type</th><th>Total</th><th>Status</th></tr></thead>
            <tbody id="recent"><tr><td colspan="4">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
</main>

<!-- JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    requireAdmin();

    async function loadDashboard(){
        try{
            const users = await api("GET", EP.users);
            const items = await api("GET", EP.items);
            const reservations = await api("GET", EP.reservations);
            const orders = await api("GET", EP.orders);
            const payments = await api("GET", EP.payments);

            document.getElementById("cUsers").textContent = users.length;
            document.getElementById("cItems").textContent = items.length;
            document.getElementById("cReservations").textContent = reservations.length;
            document.getElementById("cOrders").textContent = orders.length;

            const revenue =payments
                .filter(p => /paid/i.test(p.paymentStatus))
                .reduce((sum, p) => sum + p.amount, 0);
            document.getElementById("cRevenue").textContent = money(revenue);

            const recent = orders.slice(-5).reverse();  // last 5 orders
            document.getElementById("recent").innerHTML = recent.length
                ? recent.map(o => `<tr><td>#${o.orderId}</td><td>${esc(o.orderType)}</td>
                    <td>${money(o.totalAmount)}</td><td>${badge(o.status)}</td></tr>`).join("")
                : '<tr><td colspan="4" class="text-secondary">No orders yet.</td></tr>';
        } catch (err) {
            document.getElementById("recent").innerHTML =
                `<tr><td colspan="4" class="text-danger">${esc(err.message)}</td></tr>`;
        }   
    }
    loadDashboard();
</script>
</body>
</html>
