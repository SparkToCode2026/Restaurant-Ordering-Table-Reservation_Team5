<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoons admin · Tables</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ============ ADMIN NAVBAR ============ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="admin-dashboard.html"><img src="img/logo.svg" alt="Spoons Logo" height="30"> spoons admin</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-users.html">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-menu-items.html">Menu Items</a></li>
          <li class="nav-item"><a class="nav-link active" href="admin-tables.html">Tables</a></li> <!-- current page -->
          <li class="nav-item"><a class="nav-link" href="admin-reservations.html">Reservations</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-orders.html">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-payments.html">Payments</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-reviews.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-ingredients.html">Ingredients</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()">Sign out</button>
      </div>
    </div>
  </nav>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold mb-0">Tables</h3>
      <button class="btn btn-danger" onclick="openAdd()"><i class="bi bi-plus-lg"></i> Add table</button>
    </div>

    <!-- Add / Edit form -->
    <div id="formCard" class="card shadow-sm mb-3 d-none"><div class="card-body">
      <h6 class="fw-bold mb-3" id="formTitle">Add table</h6>
      <form onsubmit="save(event)">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Table number</label><input id="fNumber" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">Capacity</label><input id="fCapacity" type="number" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">Location</label><input id="fLocation" class="form-control" required></div>
          <div class="col-12">
            <div class="form-check form-switch"><input id="fActive" type="checkbox" class="form-check-input" checked><label class="form-check-label">Active</label></div>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-danger">Save</button>
          <button type="button" class="btn btn-light" onclick="closeForm()">Cancel</button>
        </div>
      </form>
    </div></div>

    <!-- Table -->
    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Number</th><th>Capacity</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
      </table>
    </div></div>
  </main>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAdmin();

    let list = [];
    let editId = null;

    async function load() {
      list = await api("GET", EP.tables);
      document.getElementById("rows").innerHTML = list.map(t => `
        <tr>
          <td>${t.tableId}</td>
          <td>${esc(t.tableNumber)}</td>
          <td>${t.capacity}</td>
          <td>${esc(t.location)}</td>
          <td>${t.isActive ? badge("Available") : badge("Inactive")}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="openEdit(${t.tableId})">Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="del(${t.tableId})">Delete</button>
          </td>
        </tr>`).join("");
    }

    function openAdd() {
      editId = null;
      document.getElementById("formTitle").textContent = "Add table";
      document.getElementById("fNumber").value = "";
      document.getElementById("fCapacity").value = "";
      document.getElementById("fLocation").value = "";
      document.getElementById("fActive").checked = true;
      document.getElementById("formCard").classList.remove("d-none");
    }

    function openEdit(id) {
      const t = list.find(x => x.tableId === id);
      editId = id;
      document.getElementById("formTitle").textContent = "Edit table";
      document.getElementById("fNumber").value = t.tableNumber;
      document.getElementById("fCapacity").value = t.capacity;
      document.getElementById("fLocation").value = t.location;
      document.getElementById("fActive").checked = t.isActive;
      document.getElementById("formCard").classList.remove("d-none");
    }

    function closeForm() { document.getElementById("formCard").classList.add("d-none"); }

    async function save(event) {
      event.preventDefault();
      const data = {
        tableNumber: document.getElementById("fNumber").value,
        capacity: Number(document.getElementById("fCapacity").value),
        location: document.getElementById("fLocation").value,
        isActive: document.getElementById("fActive").checked
      };
      try {
        if (editId) await api("PUT", EP.tableUpdate(editId), data);
        else        await api("POST", EP.tableCreate, data);
        closeForm();
        load();
      } catch (err) { alert(err.message); }
    }

    async function del(id) {
      if (!confirm("Delete table #" + id + "?")) return;
      try { await api("DELETE", EP.tableDelete(id)); load(); }
      catch (err) { alert(err.message); }
    }

    load();
  </script>
</body>
</html>
