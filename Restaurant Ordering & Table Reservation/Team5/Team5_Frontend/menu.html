<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoons · Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html"><img src="img/logo.svg" alt="Spoons Logo" height="30"> spoons</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="reserve.html">Reserve</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="reservations.html">My Reservations</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="cart.html" class="btn btn-outline-danger"><i class="bi bi-cart3"></i> Cart <span id="cartCount" class="badge text-bg-danger">0</span></a>
          <a href="profile.html" class="btn btn-outline-secondary"><i class="bi bi-person"></i></a>
          <button class="btn btn-outline-secondary" onclick="logout()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="container py-4">
    <h3 class="fw-bold mb-3">Our Menu</h3>

    <!-- Search + category filter (plain HTML controls) -->
    <div class="row g-2 mb-4">
      <div class="col-md-8"><input id="search" class="form-control" placeholder="Search dishes…" oninput="showDishes()"></div>
      <div class="col-md-4"><select id="catFilter" class="form-select" onchange="showDishes()">
        <option value="">All categories</option>
      </select></div>
    </div>

    <!-- Dishes appear here -->
    <div id="dishes" class="row g-3">Loading…</div>
  </main>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireLogin();

    let allDishes = [];  // we load the dishes once and keep them here

    // Load categories (for the dropdown) and dishes (for the grid).
    async function loadMenu() {
      try {
        const cats = await api("GET", EP.categories);
        document.getElementById("catFilter").innerHTML =
          '<option value="">All categories</option>' +
          cats.map(c => `<option value="${c.menuCategoryId}">${esc(c.menuCategoryName)}</option>`).join("");

        allDishes = await api("GET", EP.items);
        showDishes();
      } catch (err) {
        document.getElementById("dishes").innerHTML =
          `<p class="text-danger">Could not load the menu: ${esc(err.message)}</p>`;
      }
    }

    // Show the dishes that match the search box and the chosen category.
    function showDishes() {
      const text = document.getElementById("search").value.toLowerCase();
      const cat  = document.getElementById("catFilter").value;
      const list = allDishes.filter(d =>
        d.menuItemName.toLowerCase().includes(text) &&
        (cat === "" || String(d.menuCategoryId) === cat)
      );

      const box = document.getElementById("dishes");
      if (list.length === 0) { box.innerHTML = '<p class="text-secondary">No dishes found.</p>'; return; }

      box.innerHTML = list.map(d => `
        <div class="col-6 col-lg-3">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h6 class="fw-bold">${esc(d.menuItemName)}</h6>
              <p class="small text-secondary">${esc(d.menuItemDescription)}</p>
              <div class="fw-bold text-danger">${money(d.price)}</div>
              ${d.isAvailable
                ? `<button class="btn btn-sm btn-danger mt-2"
                     onclick="Cart.add(${d.menuItemId}, '${esc(d.menuItemName)}', ${d.price}); location.reload()">Add to cart</button>`
                : `<button class="btn btn-sm btn-secondary mt-2" disabled>Sold out</button>`}
            </div>
          </div>
        </div>`).join("");
    }

    loadMenu();
  </script>
</body>
</html>
