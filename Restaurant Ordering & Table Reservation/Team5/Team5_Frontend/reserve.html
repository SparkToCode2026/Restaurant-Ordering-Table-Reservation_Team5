<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoons · Reserve a table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html"><img src="img/logo.svg" alt="Spoons Logo" height="30"> spoons</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link active" href="reserve.html">Reserve</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="reservations.html">My Reservations</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="cart.html" class="btn btn-outline-danger"><i class="bi bi-cart3"></i> Cart <span id="cartCount" class="badge text-bg-danger">0</span></a>
          <a href="profile.html" class="btn btn-outline-secondary"><i class="bi bi-person"></i></a>
          <button class="btn btn-outline-secondary" onclick="logout()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="container py-4" style="max-width:640px">
    <h3 class="fw-bold mb-3">Reserve a table</h3>

    <div class="card shadow-sm"><div class="card-body p-4">
      <form onsubmit="doReserve(event)">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Date</label>
            <input id="date" type="date" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Guests</label>
            <input id="guests" type="number" class="form-control" min="1" max="20" value="2" required>
          </div>
          <div class="col-12">
            <label class="form-label">Time</label>
            <select id="time" class="form-select" required>
              <option value="18:00:00">18:00</option>
              <option value="19:00:00" selected>19:00</option>
              <option value="20:00:00">20:00</option>
              <option value="21:00:00">21:00</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Table</label>
            <!-- the tables are added here by the script -->
            <select id="table" class="form-select" required><option>Loading…</option></select>
          </div>
        </div>
        <button class="btn btn-danger btn-lg w-100 mt-4">Confirm reservation</button>
      </form>
    </div></div>
  </main>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireLogin();

    // Start the date box on today.
    document.getElementById("date").value = new Date().toISOString().slice(0, 10);

    // Fill the "Table" dropdown with the active tables from the server.
    async function loadTables() {
      try {
        const tables = await api("GET", EP.tables);
        document.getElementById("table").innerHTML = tables
          .filter(t => t.isActive)
          .map(t => `<option value="${t.tableId}">${esc(t.tableNumber)} — ${esc(t.location)} (seats ${t.capacity})</option>`)
          .join("");
      } catch (err) { alert("Could not load tables: " + err.message); }
    }

    // Send the reservation to the server.
    async function doReserve(event) {
      event.preventDefault();
      try {
        await api("POST", EP.reservations, {
          reservationDate: document.getElementById("date").value,
          reservationTime: document.getElementById("time").value,
          partySize:       Number(document.getElementById("guests").value),
          status:          "Confirmed",
          createdAt:       new Date().toISOString(),
          userId:          me().userId,
          tableId:         Number(document.getElementById("table").value)
        });
        alert("Reservation confirmed! A confirmation email is on its way.");
        location.href = "reservations.html";
      } catch (err) { alert(err.message); }
    }

    loadTables();
  </script>
</body>
</html>
