  <!-- ============ PAGE CONTENT ============ -->
 <main class="container py-4">
   <div class="d-flex justify-content-between align-items-center mb-3">
     <h3 class="fw-bold mb-0">My Reservations</h3>
     <a href="reserve.html" class="btn btn-danger"><i class="bi bi-plus-lg"></i> New reservation</a>
   </div>

   <div class="card shadow-sm">
     <div class="table-responsive">
       <table class="table table-hover align-middle mb-0">
         <thead>
           <tr><th>Table</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th><th></th></tr>
         </thead>
         <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
       </table>
     </div>
   </div>
 </main>
 <!-- ===== a little JavaScript for this page ===== -->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script src="js/app.js"></script>
 <script>
   requireLogin();

   // Load my reservations and show them.
   async function loadReservations() {
     const rows = document.getElementById("rows");
     try {
       const tables = await api("GET", EP.tables);   // to show the table number
       const all    = await api("GET", EP.reservations);
       const mine   = all.filter(r => r.userId === me().userId);
       const tableOf = id => (tables.find(t => t.tableId === id) || {}).tableNumber || ("#" + id);

       if (mine.length === 0) { rows.innerHTML = '<tr><td colspan="6" class="text-secondary">No reservations yet.</td></tr>'; return; }

       rows.innerHTML = mine.map(r => `
         <tr>
           <td>${esc(tableOf(r.tableId))}</td>
           <td>${esc(r.reservationDate)}</td>
           <td>${esc(String(r.reservationTime).slice(0,5))}</td>
           <td>${r.partySize}</td>
           <td>${badge(r.status)}</td>
           <td>${/cancel|complet/i.test(r.status) ? "" :
                 `<button class="btn btn-sm btn-outline-danger" onclick="cancelReservation(${r.reservationId})">Cancel</button>`}</td>
         </tr>`).join("");
     } catch (err) {
       rows.innerHTML = `<tr><td colspan="6" class="text-danger">${esc(err.message)}</td></tr>`;
     }
   }

   // Cancel a reservation (change its status to "Cancelled").
   async function cancelReservation(id) {
     if (!confirm("Cancel this reservation?")) return;
     try {
       await api("PUT", EP.reservationStatus(id, "Cancelled"));
       loadReservations();   // reload the list
     } catch (err) { alert(err.message); }
   }

   loadReservations();
 </script>
    </body>
</html>
