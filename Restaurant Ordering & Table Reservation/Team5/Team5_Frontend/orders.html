<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>spoons . My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html"><img src="img/logo.svg" alt="spoons" width="30" height="30" class="me-2"> spoons</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="reserve.html">Reserve</a></li>
          <li class="nav-item"><a class="nav-link active" href="orders.html">My Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="reservations.html">My Reservations</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="cart.html" class="btn btn-outline-danger"><i class="bi bi-cart3"></i> Cart <span id="cartCount" class="badge text-bg-danger">0</span></a>
          <a href="profile.html" class="btn btn-outline-secondary"><i class="bi bi-person"></i></a>
          <button class="btn btn-outline-secondary" onclick="logout()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="container py-4">
    <h3 class="fw-bold mb-3">My Orders</h3>

    <div class="card shadow-sm"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead><tr><th>Order</th><th>Type</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
            <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
        </table>
    </div></div>

    <!-- The items of the order you click on appear here -->
    <div id="details" class="mt-3"></div>
  </main>
  
    <!-- a little JavaScript for this page -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireLogin();

    // Load all orders, keep only mine, and show them in the table.
    async function loadOrders() {
      const rows = document.getElementById("rows");
      try {
        const orders = await api("GET", EP.orders);
        const mine = orders.filter(o => o.userId === me().userId);

        if (mine.length === 0) { rows.innerHTML = '<tr><td colspan="6" class="text-secondary">No orders yet.</td></tr>'; return; }

        rows.innerHTML = mine.map(o => `
          <tr>
            <td>#${o.orderId}</td>
            <td>${esc(o.orderType)}</td>
            <td>${new Date(o.orderDate).toLocaleString()}</td>
            <td>${money(o.totalAmount)}</td>
            <td>${badge(o.status)}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="viewItems(${o.orderId})">View items</button></td>
          </tr>`).join("");
      } catch (err) {
        rows.innerHTML = `<tr><td colspan="6" class="text-danger">${esc(err.message)}</td></tr>`;
      }
    }

    // Show the items belonging to one order.
    async function viewItems(orderId) {
      const box = document.getElementById("details");
      box.innerHTML = "Loading…";
      try {
        const dishes = await api("GET", EP.items);              // to show dish names
        const items  = await api("GET", EP.orderItemsByOrder(orderId));
        const nameOf = id => (dishes.find(d => d.menuItemId === id) || {}).menuItemName || ("#" + id);

        box.innerHTML = `
          <div class="card shadow-sm"><div class="card-body">
            <h6 class="fw-bold">Order #${orderId} items</h6>
            <table class="table mb-0">
              <thead><tr><th>Dish</th><th>Qty</th><th>Unit</th><th>Subtotal</th></tr></thead>
              <tbody>${items.map(i => `<tr>
                <td>${esc(nameOf(i.menuItemId))}</td><td>${i.quantity}</td>
                <td>${money(i.unitPrice)}</td><td>${money(i.subtotal)}</td></tr>`).join("")}
              </tbody>
            </table>
          </div></div>`;
      } catch (err) { box.innerHTML = `<p class="text-danger">${esc(err.message)}</p>`; }
    }

    loadOrders();
  </script>

</body>
</html>
