<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoons admin · Menu Items</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ============ ADMIN NAVBAR ============ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="admin-dashboard.html"><img src="img/logo.svg" alt="Spoons Logo" height="30"> spoons admin</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-users.html">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link active" href="admin-menu-items.html">Menu Items</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-tables.html">Tables</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-reservations.html">Reservations</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-orders.html">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-payments.html">Payments</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-reviews.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-ingredients.html">Ingredients</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()">Sign out</button>
      </div>
    </div>
  </nav>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold mb-0">Menu Items</h3>
      <button class="btn btn-danger" onclick="openAdd()"><i class="bi bi-plus-lg"></i> Add item</button>
    </div>

    <!-- Add / Edit form -->
    <div id="formCard" class="card shadow-sm mb-3 d-none"><div class="card-body">
      <h6 class="fw-bold mb-3" id="formTitle">Add item</h6>
      <form onsubmit="save(event)">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Name</label><input id="fName" class="form-control" required></div>
          <div class="col-md-3"><label class="form-label">Price</label><input id="fPrice" type="number" step="0.01" class="form-control" required></div>
          <div class="col-md-3"><label class="form-label">Category</label><select id="fCat" class="form-select" required></select></div>
          <div class="col-12"><label class="form-label">Description</label><textarea id="fDesc" class="form-control" required></textarea></div>
          <div class="col-md-8"><label class="form-label">Image URL (optional)</label><input id="fImg" class="form-control"></div>
          <div class="col-md-4 d-flex align-items-end">
            <div class="form-check form-switch"><input id="fAvail" type="checkbox" class="form-check-input" checked><label class="form-check-label">Available</label></div>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-danger">Save</button>
          <button type="button" class="btn btn-light" onclick="closeForm()">Cancel</button>
        </div>
      </form>
    </div></div>

    <!-- Table -->
    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th>Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
      </table>
    </div></div>
  </main>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAdmin();

    let list = [];
    let categories = [];
    let editId = null;

    // Load categories (for the dropdown + names) and the items.
    async function load() {
      categories = await api("GET", EP.categories);
      document.getElementById("fCat").innerHTML =
        categories.map(c => `<option value="${c.menuCategoryId}">${esc(c.menuCategoryName)}</option>`).join("");

      list = await api("GET", EP.items);
      const catName = id => (categories.find(c => c.menuCategoryId === id) || {}).menuCategoryName || ("#" + id);

      document.getElementById("rows").innerHTML = list.map(m => `
        <tr>
          <td>${m.menuItemId}</td>
          <td>${esc(m.menuItemName)}</td>
          <td>${esc(catName(m.menuCategoryId))}</td>
          <td>${money(m.price)}</td>
          <td>${m.isAvailable ? badge("Available") : badge("Sold out")}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="openEdit(${m.menuItemId})">Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="del(${m.menuItemId})">Delete</button>
          </td>
        </tr>`).join("");
    }

    function openAdd() {
      editId = null;
      document.getElementById("formTitle").textContent = "Add item";
      document.getElementById("fName").value = "";
      document.getElementById("fPrice").value = "";
      document.getElementById("fDesc").value = "";
      document.getElementById("fImg").value = "";
      document.getElementById("fAvail").checked = true;
      document.getElementById("formCard").classList.remove("d-none");
    }

    function openEdit(id) {
      const m = list.find(x => x.menuItemId === id);
      editId = id;
      document.getElementById("formTitle").textContent = "Edit item";
      document.getElementById("fName").value = m.menuItemName;
      document.getElementById("fPrice").value = m.price;
      document.getElementById("fDesc").value = m.menuItemDescription;
      document.getElementById("fImg").value = m.imageUrl;
      document.getElementById("fCat").value = m.menuCategoryId;
      document.getElementById("fAvail").checked = m.isAvailable;
      document.getElementById("formCard").classList.remove("d-none");
    }

    function closeForm() { document.getElementById("formCard").classList.add("d-none"); }

    async function save(event) {
      event.preventDefault();
      const data = {
        menuItemName: document.getElementById("fName").value,
        menuItemDescription: document.getElementById("fDesc").value,
        price: Number(document.getElementById("fPrice").value),
        // the backend needs a non-empty image link, so use a placeholder if left blank
        imageUrl: document.getElementById("fImg").value || "https://placehold.co/400x300/E4002B/fff?text=spoons",
        isAvailable: document.getElementById("fAvail").checked,
        menuCategoryId: Number(document.getElementById("fCat").value)
      };
      try {
        if (editId) { data.menuItemId = editId; await api("PUT", EP.itemUpdate(editId), data); }
        else        { await api("POST", EP.itemCreate, data); }
        closeForm();
        load();
      } catch (err) { alert(err.message); }
    }

    async function del(id) {
      if (!confirm("Delete item #" + id + "?")) return;
      try { await api("DELETE", EP.itemDelete(id)); load(); }
      catch (err) { alert(err.message); }
    }

    load();
  </script>
</body>
</html>
