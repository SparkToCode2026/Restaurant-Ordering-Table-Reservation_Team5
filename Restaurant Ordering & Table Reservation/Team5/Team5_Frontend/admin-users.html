<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoons admin · Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ============ ADMIN NAVBAR ============ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="admin-dashboard.html"><img src="img/logo.svg" alt="Spoons Logo" height="30"> spoons admin</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="admin-users.html">Users</a></li> <!-- current page -->
          <li class="nav-item"><a class="nav-link" href="admin-categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-menu-items.html">Menu Items</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-tables.html">Tables</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-reservations.html">Reservations</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-orders.html">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-payments.html">Payments</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-reviews.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-ingredients.html">Ingredients</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()">Sign out</button>
      </div>
    </div>
  </nav>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold mb-0">Users</h3>
      <button class="btn btn-danger" onclick="openAdd()"><i class="bi bi-plus-lg"></i> Add user</button>
    </div>

    <!-- Add / Edit form (hidden until you click Add or Edit) -->
    <div id="formCard" class="card shadow-sm mb-3 d-none"><div class="card-body">
      <h6 class="fw-bold mb-3" id="formTitle">Add user</h6>
      <form onsubmit="save(event)">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Name</label><input id="fName" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Email</label><input id="fEmail" type="email" class="form-control" required></div>
          <div class="col-md-6" id="passwordRow"><label class="form-label">Password</label><input id="fPassword" type="password" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Phone</label><input id="fPhone" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Role</label>
            <select id="fRole" class="form-select"><option>Customer</option><option>Admin</option></select></div>
        </div>
        <div class="mt-3">
          <button class="btn btn-danger">Save</button>
          <button type="button" class="btn btn-light" onclick="closeForm()">Cancel</button>
        </div>
      </form>
    </div></div>

    <!-- The table of users -->
    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
      </table>
    </div></div>
  </main>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAdmin();

    let list = [];       // the users we loaded
    let editId = null;   // null = adding, a number = editing that user

    // Load the users into the table.
    async function load() {
      list = await api("GET", EP.users);
      document.getElementById("rows").innerHTML = list.map(u => `
        <tr>
          <td>${u.userId}</td>
          <td>${esc(u.userName)}</td>
          <td>${esc(u.userEmail)}</td>
          <td>${badge(u.role)}</td>
          <td>${esc(u.phoneNumber)}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="openEdit(${u.userId})">Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="del(${u.userId})">Delete</button>
          </td>
        </tr>`).join("");
    }

    // Show the empty form to add a new user.
    function openAdd() {
      editId = null;
      document.getElementById("formTitle").textContent = "Add user";
      document.getElementById("fName").value = "";
      document.getElementById("fEmail").value = "";
      document.getElementById("fPassword").value = "";
      document.getElementById("fPhone").value = "";
      document.getElementById("fRole").value = "Customer";
      document.getElementById("passwordRow").classList.remove("d-none"); // password needed for new users
      document.getElementById("formCard").classList.remove("d-none");
    }

    // Show the form filled in with an existing user.
    function openEdit(id) {
      const u = list.find(x => x.userId === id);
      editId = id;
      document.getElementById("formTitle").textContent = "Edit user";
      document.getElementById("fName").value = u.userName;
      document.getElementById("fEmail").value = u.userEmail;
      document.getElementById("fPhone").value = u.phoneNumber;
      document.getElementById("fRole").value = u.role;
      document.getElementById("passwordRow").classList.add("d-none"); // don't change password when editing
      document.getElementById("formCard").classList.remove("d-none");
    }

    function closeForm() { document.getElementById("formCard").classList.add("d-none"); }

    // Save the form: create a new user, or update the one being edited.
    async function save(event) {
      event.preventDefault();
      const name  = document.getElementById("fName").value;
      const email = document.getElementById("fEmail").value;
      const phone = document.getElementById("fPhone").value;
      const role  = document.getElementById("fRole").value;
      try {
        if (editId) {
          await api("PUT", EP.users + "/" + editId,
            { userId: editId, userName: name, userEmail: email, role: role, phoneNumber: phone });
        } else {
          await api("POST", EP.register,
            { userName: name, userEmail: email, password: document.getElementById("fPassword").value, phoneNumber: phone, role: role });
        }
        closeForm();
        load();
      } catch (err) { alert(err.message); }
    }

    // Delete a user.
    async function del(id) {
      if (!confirm("Delete user #" + id + "?")) return;
      try { await api("DELETE", EP.users + "/" + id); load(); }
      catch (err) { alert(err.message); }
    }

    load();
  </script>
</body>
</html>
