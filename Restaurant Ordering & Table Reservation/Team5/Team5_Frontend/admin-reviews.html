<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoons admin · Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ============ ADMIN NAVBAR ============ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="admin-dashboard.html"><i class="bi bi-flower1 text-danger"></i> spoons admin</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-users.html">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-menu-items.html">Menu Items</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-tables.html">Tables</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-reservations.html">Reservations</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-orders.html">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-payments.html">Payments</a></li>
          <li class="nav-item"><a class="nav-link active" href="admin-reviews.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-ingredients.html">Ingredients</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()">Sign out</button>
      </div>
    </div>
  </nav>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="container-fluid p-4">
    <h3 class="fw-bold mb-3">Reviews</h3>

    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Customer</th><th>Dish</th><th>Rating</th><th>Comment</th><th>Date</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody>
      </table>
    </div></div>
  </main>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAdmin();

    async function load() {
      const rows = document.getElementById("rows");
      try {
        const users  = await api("GET", EP.users);
        const dishes = await api("GET", EP.items);
        const list   = await api("GET", EP.reviews);
        const userName = id => (users.find(u => u.userId === id) || {}).userName || (id ? "#" + id : "—");
        const dishName = id => (dishes.find(d => d.menuItemId === id) || {}).menuItemName || (id ? "#" + id : "—");

        rows.innerHTML = list.length ? list.map(r => `
          <tr>
            <td>${r.reviewId}</td>
            <td>${esc(userName(r.userId))}</td>
            <td>${esc(dishName(r.menuItemId))}</td>
            <td>${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</td>
            <td>${esc(r.comment)}</td>
            <td>${new Date(r.createdAt).toLocaleDateString()}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="del(${r.reviewId})">Delete</button></td>
          </tr>`).join("") : '<tr><td colspan="7" class="text-secondary">No reviews yet.</td></tr>';
      } catch (err) {
        rows.innerHTML = `<tr><td colspan="7" class="text-danger">${esc(err.message)}</td></tr>`;
      }
    }

    async function del(id) {
      if (!confirm("Delete review #" + id + "?")) return;
      try { await api("DELETE", EP.reviewDelete(id)); load(); }
      catch (err) { alert(err.message); }
    }

    load();
  </script>
</body>
</html>
