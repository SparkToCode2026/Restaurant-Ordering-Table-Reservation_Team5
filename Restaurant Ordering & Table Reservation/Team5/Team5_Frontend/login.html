<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoons · Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-bg d-flex align-items-center justify-content-center p-3" style="min-height:100vh">

  <div class="card shadow border-0" style="width:100%; max-width:430px; border-radius:1rem">
    <div class="card-body p-4 p-md-5">

      <!-- Logo + title -->
      <div class="text-center mb-4">
        <img src="img/logo.svg" alt="Spoons Logo"  height="70">
        <h2 class="fw-bold mt-2 mb-0">spoons</h2>
        <p class="text-secondary">Restaurant Ordering &amp; Table Reservation</p>
      </div>

      <!-- Two tab buttons -->
      <div class="btn-group w-100 mb-4">
        <button class="btn btn-danger" onclick="showTab('login')">Sign in</button>
        <button class="btn btn-outline-danger" onclick="showTab('register')">Create account</button>
      </div>

      <!-- LOGIN box -->
      <form id="loginBox" onsubmit="doLogin(event)">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input id="loginEmail" type="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="loginPassword" type="password" class="form-control" required>
        </div>
        <button class="btn btn-danger w-100 py-2">Sign in</button>
        <p class="small text-secondary text-center mt-3 mb-0">
          Demo admin: <b>admin@spoons.com</b> / <b>admin123</b>
        </p>
      </form>

      <!-- REGISTER box (hidden until you click the tab) -->
      <form id="registerBox" class="d-none" onsubmit="doRegister(event)">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Full name</label><input id="regName" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Phone</label><input id="regPhone" class="form-control" required></div>
          <div class="col-12"><label class="form-label">Email</label><input id="regEmail" type="email" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Password</label><input id="regPassword" type="password" minlength="6" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Account type</label>
            <select id="regRole" class="form-select"><option>Customer</option><option>Admin</option></select></div>
        </div>
        <button class="btn btn-danger w-100 py-2 mt-4">Create account</button>
      </form>

    </div>
  </div>

  <!-- ===== a little JavaScript for this page ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    // If you are already signed in, skip the login page.
    if (isLoggedIn()) location.href = isAdmin() ? "admin-dashboard.html" : "index.html";

    // Show the Login box or the Register box.
    function showTab(which) {
      document.getElementById("loginBox").classList.toggle("d-none", which !== "login");
      document.getElementById("registerBox").classList.toggle("d-none", which !== "register");
    }

    // Sign in: send email + password, save the answer, go to the right page.
    async function doLogin(event) {
      event.preventDefault();
      try {
        const data = await api("POST", EP.login, {
          userEmail: document.getElementById("loginEmail").value,
          password:  document.getElementById("loginPassword").value
        });
        saveLogin(data.token, data.user);
        location.href = data.user.role === "Admin" ? "admin-dashboard.html" : "index.html";
      } catch (err) { alert(err.message); }
    }

    // Register: create the account, then show the login box.
    async function doRegister(event) {
      event.preventDefault();
      try {
        await api("POST", EP.register, {
          userName:    document.getElementById("regName").value,
          userEmail:   document.getElementById("regEmail").value,
          password:    document.getElementById("regPassword").value,
          phoneNumber: document.getElementById("regPhone").value,
          role:        document.getElementById("regRole").value
        });
        alert("Account created! Please sign in.");
        showTab("login");
      } catch (err) { alert(err.message); }
    }
  </script>
</body>
</html>
